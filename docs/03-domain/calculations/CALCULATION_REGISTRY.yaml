    spec_version: "1.0.0"
    implementation: packages/python/vertex_core/src/vertex_core/calculations/options.py::payoff_at_expiry
    method: exact_decimal_intrinsic_leg_sum
    assumptions:
      - "P&L_T(S) = sum_i q_i * M_i * [h_i(S) - p_i] - F with h_CALL(S) = max(S - K, 0), h_PUT(S) = max(K - S, 0), h_STOCK(S) = S and F = declared fees."
      - "Entirely Decimal arithmetic under a local 60-significant-digit context: payoffs are EXACT at every strike breakpoint and leg-sum linearity is exact. Terminal spots given as float are converted by their exact binary expansion."
      - "Expiry only; before expiry the legs are repriced by options.scenario_grid."
      - "Any structure containing a SHORT quantity must be certified by defined_risk_check (strict closed catalogue); an uncertified structure raises undefined_risk_structure and is never priced. Strictly all-long structures pass without certification."
      - "Every terminal spot must be finite and >= 0 (zero = bankruptcy tail); fees must be a finite non-negative Decimal (costs are declared, never defaulted)."
      - "All legs share one underlying, one currency and one expiry by construction of the caller. No field of OptionLeg is a transmissible order ticket."
    parameter_schema:
      legs: {type: "Sequence[OptionLeg]", unit: declared_structure, constraint: "non-empty; quantity a non-zero signed int; right CALL/PUT/STOCK; strike required for CALL/PUT and forbidden for STOCK; premium >= 0; multiplier > 0"}
      terminal_spot_grid: {type: "Sequence[int | float | Decimal]", unit: price, constraint: "non-empty, each finite and >= 0"}
      fees: {type: Decimal, unit: money, constraint: "finite Decimal instance, >= 0"}
      returns: {type: "tuple[Decimal, ...]", unit: money, note: "one exact P&L per grid point, in grid order"}
    tolerances:
      decimal_context_precision: 60
      note: >-
        Exact Decimal arithmetic: the tests assert exact equality
        (== Decimal("...")) with NO numeric tolerance, including the leg-sum
        linearity property. Documented bound: inputs with more than about 50
        significant digits would round.
    oracle: hand_derived_golden_vectors
    oracle_evidence: >-
      TestPayoffAtExpiry asserts hand-derived breakpoint vectors for a
      certified bull call debit (-301.50, 198.50, 698.50 with the derivation
      in comments), the exact breakeven at K1 + D/M, the bankruptcy tail
      9600, and test_certified_vertical_equals_hand_computed_leg_sum
      recomputes sum(q*M*(h(S)-p)) by hand inside the test.
    criticality: critical
    tests:
      - packages/python/vertex_core/tests/calculations/test_options.py
      - packages/python/vertex_core/tests/calculations/test_options_properties.py
      - apps/api/tests/test_simulation_preview.py
  - id: options.scenario_grid
    owner: simulation
    inputs: [legs, spot_grid, time_grid, iv_scenarios, curves]
    output_unit: money_matrix
    gates: [consistent_snapshot]
    invariants: [deterministic, finite]
    runtime_status: APPROVED
    spec_version: "1.0.0"
    implementation: packages/python/vertex_core/src/vertex_core/calculations/options.py::scenario_grid
    method: bsm_repricing_per_cell_float64
    assumptions:
      - "Each cell [scenario][time][spot] reprices EVERY leg on the SAME assumption snapshot (one rate, one dividend yield, one per-leg volatility vector per scenario, one remaining maturity per time point) and sums q_i * M_i * (model_value_i(S, T, vol_i) - p_i). STOCK legs contribute q * M * (S - p)."
      - "Fees are NOT subtracted here: the grid is P&L before declared costs."
      - "Each scenario is a vector aligned index by index with legs: None for STOCK legs (required, fail-closed) and an annualized volatility in [0, 10] for option legs. A missing volatility for an option leg is rejected, never converted to zero."
      - "All legs share the single expiry described by time_grid_years; calendar and diagonal structures are out of scope."
      - "Premiums are converted to float64 here (documented conversion); exact money arithmetic stays in options.payoff."
      - "Any structure containing a SHORT quantity must be certified by defined_risk_check before any pricing; every leg strike and premium is validated against the SAME model domain as options.european_price."
      - "Every spot must be strictly positive and inside the domain (a zero terminal spot belongs to options.payoff)."
    parameter_schema:
      legs: {type: "Sequence[OptionLeg]", unit: declared_structure, constraint: "non-empty; short quantities require defined_risk_check certification"}
      spot_grid: {type: "Sequence[int | float | Decimal]", unit: price, constraint: "non-empty, each finite and in (0, 1e12]"}
      time_grid_years: {type: "Sequence[int | float | Decimal]", unit: years_act365, constraint: "non-empty, each in [0, 100]"}
      iv_scenarios: {type: "Sequence[Sequence[Optional[int | float | Decimal]]]", unit: annualized_decimal, constraint: "non-empty; each scenario has exactly len(legs) entries; None exactly for STOCK legs; option-leg volatilities in [0, 10]"}
      rate: {type: "int | float | Decimal", unit: continuously_compounded_annualized_decimal, constraint: "in [-1, 1]"}
      dividend_yield: {type: "int | float | Decimal", unit: continuously_compounded_annualized_decimal, constraint: "in [-1, 1]"}
      returns: {type: "tuple[tuple[tuple[float, ...], ...], ...]", unit: money, note: "indexed [scenario][time][spot], every cell finite"}
