      float64_rel_tol: 1.0e-9
      float64_abs_tol: 1.0e-12
      cell_vs_bsm_rel: 1.0e-12
      convergence_to_payoff_abs: 1.0e-9
      note: >-
        test_single_leg_cell_equals_bsm_repricing asserts rel=1e-12 against an
        in-test recomputation; test_converges_to_payoff_at_expiry asserts
        abs=1e-9 against the exact Decimal payoff at T = 0.
    oracle: independent_recomputation_in_test
    oracle_evidence: >-
      At T = 0 every cell is compared with options.payoff, an INDEPENDENT
      exact-Decimal implementation (abs=1e-9); each cell is also compared with
      an in-test recomposition q*M*(european_price(...) - premium), the pricer
      itself being validated three ways in test_options_oracle.py.
    oracle_limitation: >-
      The per-cell check reuses options.european_price, so it validates the
