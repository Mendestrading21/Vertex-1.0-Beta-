  - id: performance.twr
    owner: performance
    inputs: [valuations, external_cashflows]
    output_unit: ratio
    gates: [complete_cashflow_boundaries]
    invariants: [cashflow_timing_neutrality]
    runtime_status: APPROVED
    spec_version: "1.0.0"
    implementation: packages/python/vertex_core/src/vertex_core/calculations/performance.py::twr
    method: chained_period_returns_decimal
    assumptions:
      - "Sub-period return r_i = V_i / (V_{i-1} + F_{i-1}) - 1; the total return is the chain-linked product minus one."
      - "Cashflow timing convention: a flow stamped at t arrives immediately AFTER the valuation observed at t and adjusts the capital base of the period STARTING at t; a flow stamped at the final valuation starts no period."
      - "Every external cashflow must land exactly on a valuation timestamp (complete_cashflow_boundaries); otherwise CashflowBoundaryError. Flows are netted per timestamp."
      - "The absence of a flow at a boundary is a true zero flow (event ledger), not missing data."
      - "Valuation timestamps must be strictly increasing; at least two valuations are required; a non-positive capital base is rejected."
      - "All arithmetic in a pinned 28-significant-digit Decimal context; one population and one currency per call."
    parameter_schema:
      valuations: {type: "Sequence[Valuation]", unit: money_at_instant, constraint: "length >= 2, strictly increasing UTC timestamps, value >= 0"}
      external_cashflows: {type: "Sequence[CashflowEvent]", unit: money, constraint: "each at exactly a valuation timestamp; positive = contribution, negative = withdrawal"}
      returns: {type: TwrResult, unit: ratio, note: "total_return and the per-period sub-returns"}
    tolerances:
      decimal_precision: 28
      note: >-
        Division is correct to 28 significant digits; the golden vector and
        the timing-neutrality tests assert exact Decimal equality, with no
        numeric tolerance.
    oracle: hand_derived_golden_vectors
    oracle_evidence: >-
      test_golden_two_period_hand_computed carries the marker
      pytest.mark.golden with the provenance comment "hand computation
      (documented 2026-08-28)"; test_cashflow_timing_neutrality re-derives the
      invariant independently over several contributions.
    criticality: critical
    tests:
      - packages/python/vertex_core/tests/calculations/test_performance.py
      - apps/worker/tests/test_performance_content.py
      - apps/api/tests/test_performance_routes.py
  - id: performance.xirr
    owner: performance
    inputs: [dated_cashflows]
    output_unit: annualized_decimal
    gates: [sign_change, unique_valid_root]
    invariants: [npv_near_zero]
    runtime_status: APPROVED
    spec_version: "1.0.0"
    implementation: packages/python/vertex_core/src/vertex_core/calculations/performance.py::xirr
    method: brentq_root_finding_on_npv_over_documented_rate_grid
    assumptions:
      - "ACT/365F year fractions measured from the earliest flow, keeping fractional days through elapsed seconds / (86400 * 365)."
      - "float64 numerical core: Decimal amounts are converted to float64 (relative representation error <= 2**-52); NPV(r) = sum(cf * (1+r)^-t)."
      - "Root existence and uniqueness are checked on the fixed 25-point XIRR_BRACKET_GRID only (documented limitation); zero or several sign changes return an explicit INVALID result with a reason, never a fabricated number."
      - "scipy.optimize.brentq with xtol=1e-12 and maxiter=200 on the single bracket."
      - "sign_change gate: at least one strictly positive and one strictly negative amount; all flows at one single instant are rejected."
      - "Deterministic: fixed grid, fixed tolerances, no randomness, no clock; the result does not depend on input order."
    parameter_schema:
      dated_cashflows: {type: "Sequence[CashflowEvent]", unit: money_at_instant, constraint: "length >= 2, at least one > 0 and one < 0, not all at one instant"}
      returns: {type: XirrResult, unit: annualized_decimal, note: "status OK or INVALID; on INVALID no rate is exposed"}
    tolerances:
      brentq_xtol: 1.0e-12
      xirr_npv_tolerance_scale: 1.0e-9
      note: >-
        XIRR_NPV_TOLERANCE_SCALE is a module constant of
        calculations/performance.py; a root is accepted only if
        |NPV(root)| <= XIRR_NPV_TOLERANCE_SCALE * sum(|cashflow|). The golden
        and oracle tests assert the rate with abs=1e-9.
    oracle: independent_recomputation_in_test
    oracle_evidence: >-
      test_oracle_polynomial_root_via_numpy solves the NPV polynomial root
      with numpy inside the test and compares with abs=1e-9;
      test_golden_one_year_ten_percent carries the marker pytest.mark.golden
      with the provenance comment "hand computation (documented 2026-08-28)".
    criticality: critical
    tests:
      - packages/python/vertex_core/tests/calculations/test_performance.py
      - apps/worker/tests/test_performance_content.py
  - id: performance.drawdown
