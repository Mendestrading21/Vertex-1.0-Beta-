schema_version: 2
# schema_version 2 adds the per-entry runtime approval block required by
# activation_rule (the eight required_runtime_fields plus runtime_status).
# Entries keep every field of schema_version 1 unchanged.
registry_status: runtime_partially_approved
registry_status_meaning: >-
  Twenty-three entries carry a verified runtime block; two entries have no
  implementation in this repository and stay NOT_IMPLEMENTED. No entry is
  approved on documentation alone: every method, tolerance, oracle and test
  path below was read in the code and in the test files it cites.
activation_rule: >-
  No entry is runtime-approved until its spec_version, method, assumptions,
  parameter_schema, tolerances, oracle, criticality and tests are present and
  verified against the real implementation and the real test files. A
  production CalculationRecord may only carry an entry whose runtime_status is
  APPROVED; tools/check_calculation_registry.py enforces this in CI.
required_runtime_fields:
  - spec_version
  - method
  - assumptions
  - parameter_schema
  - tolerances
  - oracle
  - criticality
  - tests
runtime_status_values:
  APPROVED: >-
    A real implementation exists in vertex_core, the eight required runtime
    fields are present and verified, an independent oracle or hand-derived
    golden vectors exist, and every cited test file exists. Only an APPROVED
    entry may appear in a production CalculationRecord.
  RESEARCH_ONLY: >-
    An implementation exists but at least one runtime approval condition is
    not met. blocking_reason names the gap. Forbidden in a production
    CalculationRecord; research and notebooks only.
  NOT_IMPLEMENTED: >-
    No implementation exists in this repository. blocking_reason names what is
    missing. The entry is a declared intention, never a pending automation.
rules:
  authority: python_only
  money_transport: decimal_string
  numerical_core: float64_with_documented_tolerance
  javascript_financial_calculation: forbidden
calculations:
  - id: market.simple_return
    owner: market_statistics
    inputs: [price_t0, price_t1]
    output_unit: ratio
    gates: [positive_prices, same_adjustment_basis]
    invariants: [finite, composition_documented]
    runtime_status: APPROVED
    spec_version: "1.0.0"
    implementation: packages/python/vertex_core/src/vertex_core/calculations/market.py::simple_return
    method: closed_form_price_ratio_minus_one
    assumptions:
      - "Arithmetic return p1 / p0 - 1, computed in float64 after an explicit conversion of int/float/Decimal inputs; bool is rejected at the boundary."
      - "Both prices must carry the same adjustment basis label; mixing bases is rejected, never silently accepted."
      - "Dimensionless output; currency and instrument identity stay with the caller."
      - "Negative zero is normalized to 0.0; a non-finite result raises CalculationInputError instead of returning inf or NaN."
    parameter_schema:
      price_t0: {type: "int | float | Decimal", unit: price, constraint: "finite and > 0"}
      price_t1: {type: "int | float | Decimal", unit: price, constraint: "finite and > 0"}
      adjustment_basis_t0: {type: str, unit: label, constraint: "non-empty, keyword-only"}
      adjustment_basis_t1: {type: str, unit: label, constraint: "non-empty, must equal adjustment_basis_t0"}
      returns: {type: float, unit: ratio}
    tolerances:
      float64_rel_tol: 1.0e-9
      float64_abs_tol: 1.0e-12
      note: >-
        FLOAT64_REL_TOL and FLOAT64_ABS_TOL are module constants of
        calculations/market.py. Multiplicative composition
        (1+r(p0,p1))*(1+r(p1,p2)) == 1+r(p0,p2) is asserted with
        rel_tol=FLOAT64_REL_TOL and abs_tol=FLOAT64_ABS_TOL on prices bounded
        to [1e-2, 1e3] (documented in the test file).
    oracle: hand_derived_golden_vectors
    oracle_evidence: >-
      Hand-derived values asserted in TestSimpleReturn (100 -> 110 == 0.10,
      100 -> 75 == -0.25) plus the Hypothesis identities
      test_simple_returns_compose_multiplicatively and
      test_log_return_matches_log1p_of_simple_return.
    oracle_limitation: >-
      No third-party independent implementation is used; the vectors are not
      registered under the pytest golden marker.
    criticality: high
    tests:
      - packages/python/vertex_core/tests/calculations/test_market.py
      - apps/worker/tests/test_markets_content.py
      - apps/api/tests/test_markets_overview.py
  - id: market.rebased_series
    owner: market_statistics
    inputs: [prices, adjustment_bases, base_value]
    output_unit: index
    gates: [empty_series, misaligned_adjustment_bases, positive_prices, same_adjustment_basis, positive_base_value]
    invariants: [first_point_equals_base, finite, consistent_with_simple_return]
    runtime_status: APPROVED
    spec_version: "1.0.0"
    implementation: packages/python/vertex_core/src/vertex_core/calculations/market.py::rebase_series
    method: closed_form_base_times_price_ratio
    assumptions:
      - "Each point is base_value * p_i / p_0, computed in float64 after an explicit conversion of int/float/Decimal inputs; bool is rejected at the boundary."
      - "The first point is returned as float(base_value) itself, never computed: it IS the base, so no rounding can move it."
      - "Every price must carry the same adjustment basis label. Comparing an adjusted close to an unadjusted one displays a FALSE spread that nothing on screen would signal; the mismatch is rejected, never silently accepted."
      - "One label per price is required. A missing label is not inferred from its neighbours."
      - "An empty series is rejected: a series with no point has no base, and inventing one would fabricate data."
      - "Dimensionless index output; currency, instrument identity and calendar alignment stay with the caller. Two rebased series are only comparable if the caller aligned their start dates."
    parameter_schema:
      prices: {type: "Sequence[int | float | Decimal]", unit: price, constraint: "non-empty, each finite and > 0"}
      adjustment_bases: {type: "Sequence[str]", unit: label, constraint: "keyword-only, same length as prices, each non-empty, all equal"}
      base_value: {type: "int | float | Decimal", unit: index, constraint: "keyword-only, finite and > 0, default 100.0"}
      returns: {type: "tuple[float, ...]", unit: index}
    tolerances:
      float64_rel_tol: 1.0e-9
      float64_abs_tol: 1.0e-12
      note: >-
        FLOAT64_REL_TOL and FLOAT64_ABS_TOL are module constants of
        calculations/market.py. The identity
        rebase_series(p)[i] / base_value - 1 == simple_return(p[0], p[i]) is
        asserted with rel_tol=FLOAT64_REL_TOL on prices bounded to [1e-2, 1e3]
        (documented in the test file). The first point is asserted EXACTLY
        equal to base_value, without tolerance.
    oracle: hand_derived_golden_vectors
    oracle_evidence: >-
      Hand-derived values asserted in TestRebaseSeries (100 -> 110 -> 90 with
      base 100 gives exactly (100.0, 110.0, 90.0)) plus the Hypothesis identity
      test_rebased_series_matches_simple_return, which ties every point back to
      the already-approved market.simple_return.
    oracle_limitation: >-
      No third-party independent implementation is used; the vectors are not
      registered under the pytest golden marker. The calculation is a ratio
      times a constant, so it inherits the numerical limits of
      market.simple_return without adding any of its own.
    criticality: high
    tests:
      - packages/python/vertex_core/tests/calculations/test_market.py
      - apps/worker/tests/test_analysis_content.py
      - apps/api/tests/test_analysis.py
      - apps/api/tests/test_risk_contract_matches_worker.py
  - id: market.log_return
    owner: market_statistics
    inputs: [price_t0, price_t1]
    output_unit: log_ratio
    gates: [strictly_positive_prices]
    invariants: [finite]
    runtime_status: APPROVED
    spec_version: "1.0.0"
    implementation: packages/python/vertex_core/src/vertex_core/calculations/market.py::log_return
    method: closed_form_log_difference
    assumptions:
      - "Computed as log(p1) - log(p0), never log(p1 / p0), so the ratio cannot overflow float64."
      - "The same_adjustment_basis gate is enforced here too (fail-closed superset of the declared gate)."
      - "Additive composition and antisymmetry hold within the documented float64 tolerance."
    parameter_schema:
      price_t0: {type: "int | float | Decimal", unit: price, constraint: "finite and > 0"}
      price_t1: {type: "int | float | Decimal", unit: price, constraint: "finite and > 0"}
      adjustment_basis_t0: {type: str, unit: label, constraint: "non-empty, keyword-only"}
      adjustment_basis_t1: {type: str, unit: label, constraint: "non-empty, must equal adjustment_basis_t0"}
      returns: {type: float, unit: log_ratio}
    tolerances:
      float64_rel_tol: 1.0e-9
      float64_abs_tol: 1.0e-12
      property_abs_tol: 1.0e-9
      note: >-
        Additive composition and antisymmetry are asserted with
        rel_tol=FLOAT64_REL_TOL and abs_tol=1e-9 / 1e-12 in the property
        classes of the test file.
    oracle: independent_recomputation_in_test
    oracle_evidence: >-
      test_nominal asserts equality with math.log(1.1) recomputed in the test;
      test_log_return_matches_log1p_of_simple_return cross-checks the log form
      against the independent simple-return path.
    oracle_limitation: >-
      No third-party independent implementation is used.
    criticality: high
    tests:
      - packages/python/vertex_core/tests/calculations/test_market.py
  - id: market.realized_volatility
    owner: market_statistics
    inputs: [returns, sampling_frequency, annualization_calendar]
    output_unit: annualized_decimal
    gates: [minimum_sample, regularized_sampling]
    invariants: [non_negative, finite]
    runtime_status: APPROVED
    spec_version: "1.0.0"
    implementation: packages/python/vertex_core/src/vertex_core/calculations/market.py::realized_volatility
    method: unbiased_sample_standard_deviation_ddof1_annualized_by_sqrt_periods
    assumptions:
      - "Unbiased sample standard deviation (ddof = 1) of the per-period returns supplied by the caller."
      - "Annualization by sqrt(periods_per_year): independent increments assumed; the caller states periods_per_year consistently with the sampling frequency (for example 252 for daily bars)."
      - "Minimum sample of 2 returns; a smaller sample is INVALID, never padded."
      - "Sums use math.fsum; an overflowing mean or variance raises CalculationInputError instead of returning inf."
    parameter_schema:
      returns: {type: "list | tuple of (int | float | Decimal)", unit: ratio_per_period, constraint: "length >= 2, every element finite"}
      periods_per_year: {type: "int | float | Decimal", unit: periods_per_year, constraint: "finite and > 0"}
      returns_value: {type: float, unit: annualized_decimal}
    tolerances:
      float64_rel_tol: 1.0e-9
      constant_series_bound: "1e-12 * max(1, |value|) * sqrt(periods_per_year)"
      note: >-
        The constant-series property test bounds the volatility of a constant
        series by 1e-12 * max(1, |value|) * sqrt(ppy), the documented float64
        mean error.
    oracle: independent_recomputation_in_test
    oracle_evidence: >-
      test_nominal_four_returns recomputes the mean and the ddof=1 variance in
      the test and compares with math.sqrt(variance * 252).
    oracle_limitation: >-
      No third-party independent implementation (numpy.std / statistics) is
      used as an oracle.
    criticality: high
    tests:
      - packages/python/vertex_core/tests/calculations/test_market.py
  - id: market.atr
    owner: indicators
    inputs: [bars, lookback]
    output_unit: price
    gates: [ordered_complete_bars]
    invariants: [non_negative]
    runtime_status: APPROVED
    spec_version: "1.0.0"
    implementation: packages/python/vertex_core/src/vertex_core/calculations/market.py::atr
    method: wilder_true_range_simple_arithmetic_mean
    assumptions:
      - "True range TR_i = max(high_i - low_i, |high_i - close_{i-1}|, |low_i - close_{i-1}|)."
      - "Simple arithmetic mean of the last lookback true ranges; Wilder recursive exponential smoothing is deliberately NOT used (deterministic, warm-up free)."
      - "Bar coherence is checked on exact Decimal values before any float conversion; timestamps must be strictly increasing."
      - "len(bars) >= lookback + 1 because each true range needs the previous close; a shorter series is INVALID, never padded."
      - "Result is expressed in the price units of the bars; currency ownership stays with the caller."
    parameter_schema:
      bars: {type: "list | tuple of OhlcBar", unit: price_bars, constraint: "strictly increasing UTC timestamps, high >= low, high >= max(open, close), low <= min(open, close), length >= lookback + 1"}
      lookback: {type: int, unit: bars, constraint: ">= 1, bool rejected"}
      returns: {type: float, unit: price}
    tolerances:
      float64_rel_tol: 1.0e-9
      note: >-
        Hand-checked true ranges are asserted with rel=FLOAT64_REL_TOL. Bar
        coherence gates compare exact Decimal values with no tolerance.
    oracle: hand_derived_golden_vectors
    oracle_evidence: >-
      The coherent_bars fixture documents each true range in a comment
      (TR = 2 then TR = 1, ATR(2) = 1.5, ATR(1) = 1.0) and the gap case
      asserts TR = 6.0 from an independently derived hand computation.
    oracle_limitation: >-
      No third-party indicator library is used as an oracle; the vectors are
      not registered under the pytest golden marker.
    criticality: high
    tests:
      - packages/python/vertex_core/tests/calculations/test_market.py
  - id: market.relative_strength
    owner: indicators
    inputs: [asset_returns, benchmark_returns, horizon]
    output_unit: ratio
    gates: [aligned_calendars]
    invariants: [finite]
    runtime_status: APPROVED
    spec_version: "1.0.0"
    implementation: packages/python/vertex_core/src/vertex_core/calculations/market.py::relative_strength
    method: compounded_simple_return_ratio_over_horizon
    assumptions:
      - "RS = prod(1 + r_asset) / prod(1 + r_benchmark) over the last horizon aligned periods."
      - "Inputs are per-period SIMPLE returns, not log returns."
      - "Calendars are aligned upstream: the two series must have exactly the same length; mismatched lengths are rejected, never truncated."
      - "Every return must be strictly greater than -1; compounding overflow or underflow raises CalculationInputError instead of returning inf or zero."
    parameter_schema:
      asset_returns: {type: "list | tuple of (int | float | Decimal)", unit: ratio_per_period, constraint: "same length as benchmark_returns, each element finite and > -1"}
      benchmark_returns: {type: "list | tuple of (int | float | Decimal)", unit: ratio_per_period, constraint: "same length as asset_returns, each element finite and > -1"}
      horizon: {type: int, unit: periods, constraint: ">= 1 and <= len(asset_returns)"}
      returns: {type: float, unit: ratio}
    tolerances:
      float64_rel_tol: 1.0e-9
      note: >-
        Hand-derived expectations and the identical-series identity are
        asserted with rel=FLOAT64_REL_TOL.
    oracle: hand_derived_golden_vectors
    oracle_evidence: >-
      test_nominal_outperformance asserts 1.21 (1.1 * 1.1) and
      test_horizon_selects_trailing_window asserts 1.1, both hand derived;
      test_identical_series_give_one is the Hypothesis identity.
    oracle_limitation: >-
      No third-party independent implementation is used.
    criticality: high
    tests:
      - packages/python/vertex_core/tests/calculations/test_market.py
  - id: market.breadth
    owner: market_statistics
    inputs: [point_in_time_universe, returns]
    output_unit: ratio
    gates: [coverage_threshold]
    invariants: [between_minus_one_and_one]
    runtime_status: APPROVED
    spec_version: "1.0.0"
    implementation: packages/python/vertex_core/src/vertex_core/calculations/market.py::breadth
    method: participation_ratio_above_over_covered
    assumptions:
      - "PARTICIPATION ratio above_count / covered_count in [0, 1]; the signed advancers-minus-decliners variant in [-1, 1] is a different calculation and is not computed here."
      - "covered_count / universe_size must reach the caller-provided coverage_threshold; no default threshold exists."
      - "Counts are exact integers (bool rejected); a coverage below the threshold is INVALID and never presented as universe breadth."
      - "A zero denominator is unreachable because coverage_threshold > 0 is required."
    parameter_schema:
      above_count: {type: int, unit: count, constraint: "0 <= above_count <= covered_count"}
      universe_size: {type: int, unit: count, constraint: ">= 1"}
      covered_count: {type: int, unit: count, constraint: "0 <= covered_count <= universe_size, keyword-only"}
      coverage_threshold: {type: "int | float | Decimal", unit: ratio, constraint: "in (0, 1], keyword-only"}
      returns: {type: float, unit: ratio}
    tolerances:
      float64_rel_tol: 1.0e-9
      note: >-
        Ratios are asserted with rel=FLOAT64_REL_TOL; the gate comparisons on
        counts are exact integer comparisons.
    oracle: independent_recomputation_in_test
    oracle_evidence: >-
      test_nominal recomputes 60 / 90 in the test and
      test_threshold_accepts_decimal recomputes 30 / 80 = 0.375; the property
      test re-derives the [0, 1] and [-1, 1] bounds independently.
    criticality: high
    tests:
      - packages/python/vertex_core/tests/calculations/test_market.py
      - apps/worker/tests/test_markets_content.py
      - apps/api/tests/test_markets_overview.py
  - id: portfolio.fx_conversion
    owner: portfolio
    inputs: [money, fx_quote, quote_as_of]
    output_unit: target_currency
    gates: [fx_fresh_for_usage]
    invariants: [round_trip_within_tolerance]
    runtime_status: RESEARCH_ONLY
    blocking_reason: >-
      The declared gate fx_fresh_for_usage is NOT enforced by this calculation
      (the code states it is owned by data_quality upstream) and no production
      caller exists, so no code path proves the freshness gate is applied
      before a conversion is used. The arithmetic itself is implemented and
      tested; approval requires a production caller that enforces
      fx_fresh_for_usage.
    spec_version: "1.0.0"
    implementation: packages/python/vertex_core/src/vertex_core/calculations/portfolio.py::fx_conversion
    method: exact_decimal_multiplication_in_pinned_context
    assumptions:
      - "fx_rate is expressed as target currency per source currency unit; the product is one Decimal multiplication in a pinned 28-significant-digit context (ROUND_HALF_EVEN)."
      - "quote_as_of must be timezone-aware; a naive datetime is rejected so the instant of the rate is always provable."
      - "Freshness of the quote is owned by data_quality upstream and is NOT checked here."
      - "Negative zero is normalized to zero; money may be negative."
    parameter_schema:
      money: {type: Decimal, unit: source_currency, constraint: "finite Decimal instance"}
      fx_rate: {type: Decimal, unit: target_per_source, constraint: "finite Decimal instance, > 0"}
      quote_as_of: {type: datetime, unit: instant, constraint: "timezone-aware UTC"}
      returns: {type: Decimal, unit: target_currency}
    tolerances:
      decimal_precision: 28
      fx_round_trip_relative_tolerance: 1.0e-20
      note: >-
        DECIMAL_PRECISION and FX_ROUND_TRIP_RELATIVE_TOLERANCE are module
        constants of calculations/portfolio.py; the round-trip property test
        bounds the error by FX_ROUND_TRIP_RELATIVE_TOLERANCE * max(1, |money|).
    oracle: independent_recomputation_in_test
    oracle_evidence: >-
      test_exact_multiplication asserts the hand-computed 100.00 * 0.9250 =
      92.5 and test_round_trip_within_documented_tolerance inverts the rate at
      28 digits in the test itself.
    criticality: critical
    tests:
      - packages/python/vertex_core/tests/calculations/test_portfolio.py
  - id: portfolio.realized_pnl
    owner: portfolio
    inputs: [lots, closing_transactions, fees, fx]
    output_unit: money
    gates: [balanced_ledger]
    invariants: [lot_conservation]
    runtime_status: APPROVED
    spec_version: "1.0.0"
    implementation: packages/python/vertex_core/src/vertex_core/calculations/portfolio.py::realized_pnl
    method: explicit_lot_referenced_ledger_matching_in_decimal
    assumptions:
      - "Each closing transaction names the lot it closes; the cost basis uses that lot's own unit_cost. No FIFO/LIFO matching is performed here: the lot method that produced the lots is chosen and versioned upstream."
      - "One single currency per call; FX conversion is a separate explicit step (portfolio.fx_conversion)."
      - "Balanced ledger: every closing transaction references a declared lot, every fee references a declared transaction, ids are unique, and total_pnl == gross_proceeds - cost_basis - total_fees exactly."
      - "Lot conservation: the summed closed quantity per lot never exceeds the open quantity."
      - "A lot never touched by a closing transaction is ABSENT from the breakdown; no zero rows are fabricated."
      - "All arithmetic is Decimal in a pinned 28-significant-digit context; output order follows the declaration order of the lots (deterministic)."
    parameter_schema:
      lots: {type: "Sequence[PositionLot]", unit: declared_lots, constraint: "non-empty, unique lot_id, one currency"}
      closing_transactions: {type: "Sequence[ClosingTransaction]", unit: ledger_entries, constraint: "unique transaction_id, known lot_id, same currency"}
      fees: {type: "Sequence[Fee]", unit: money, constraint: "unique fee_id, applies_to a known transaction_id, same currency, amount >= 0"}
      returns: {type: RealizedPnlResult, unit: money, note: "currency, gross_proceeds, cost_basis, total_fees, total_pnl and the per-lot breakdown"}
    tolerances:
      decimal_precision: 28
      note: >-
        Exact Decimal arithmetic. Additions, subtractions and multiplications
        on realistic magnitudes are exact; the ledger balance is asserted with
        exact equality in the tests, no numeric tolerance.
    oracle: hand_derived_golden_vectors
    oracle_evidence: >-
      test_golden_hand_computed_single_lot carries the marker
      pytest.mark.golden and the provenance comment "hand computation
      (documented 2026-08-28)"; test_ledger_balance_across_lots re-derives the
      ledger identity independently.
    criticality: critical
    tests:
      - packages/python/vertex_core/tests/calculations/test_portfolio.py
      - apps/worker/tests/test_portfolio_content.py
  - id: portfolio.unrealized_pnl
    owner: portfolio
    inputs: [open_lots, market_snapshot, fees, fx]
    output_unit: money
    gates: [fresh_mark, balanced_ledger]
    invariants: [aggregation_linear]
    runtime_status: APPROVED
    spec_version: "1.0.0"
    implementation: packages/python/vertex_core/src/vertex_core/calculations/portfolio.py::unrealized_pnl
    method: per_lot_mark_to_market_difference_in_decimal
    assumptions:
      - "Per lot: quantity * (mark - unit_cost) - fees, summed in a pinned 28-significant-digit Decimal context."
      - "A lot whose mark is ABSENT is excluded from the aggregate and reported in excluded_lot_ids; it is never valued at zero. When no lot can be valued, total_unrealized is None, never 0."
      - "A mark that is PRESENT but invalid (non-Decimal, non-finite or negative) is corrupt input and raises MarkError."
      - "Mark freshness (fresh_mark gate) is owned by data_quality upstream; this function only consumes the marks it is given."
      - "One single currency per call; mark keys matching no declared lot are ignored."
    parameter_schema:
      open_lots: {type: "Sequence[PositionLot]", unit: declared_lots, constraint: "non-empty, unique lot_id, one currency"}
      marks: {type: "Mapping[str, Decimal]", unit: price_per_unit, constraint: "keyed by lot_id, finite and >= 0 when present"}
      fees: {type: "Sequence[Fee]", unit: money, constraint: "applies_to a known lot_id, amount >= 0"}
      returns: {type: UnrealizedPnlResult, unit: money, note: "total_unrealized may be None, plus excluded_lot_ids and the per-lot breakdown"}
    tolerances:
      decimal_precision: 28
      note: >-
        Exact Decimal arithmetic; the linearity property test asserts exact
        equality between the aggregate and the sum of the per-lot
        contributions, with no numeric tolerance.
    oracle: hand_derived_golden_vectors
    oracle_evidence: >-
      test_golden_missing_mark_excluded_never_zero carries the marker
      pytest.mark.golden with the provenance comment "hand computation
      (documented 2026-08-28)"; test_aggregation_is_linear recomputes the
      aggregate from the per-lot contributions inside the test.
    gate_ownership_note: >-
      The fresh_mark gate is not enforced inside this function. Its production
      caller (apps/worker/src/vertex_worker/portfolio.py) enforces mark
      AVAILABILITY fail-closed and records a reason per excluded lot
      (no_markets_snapshot, missing_mark, invalid_mark,
      mark_currency_mismatch), but applies no age-based staleness threshold at
      this boundary; freshness remains owned by data_quality upstream.
    criticality: critical
    tests:
      - packages/python/vertex_core/tests/calculations/test_portfolio.py
      - apps/worker/tests/test_portfolio_content.py
  - id: portfolio.concentration
    owner: portfolio_risk
    inputs: [marked_positions, grouping]
    output_unit: ratio
    gates: [positive_denominator]
    invariants: [weights_sum_to_one]
    runtime_status: APPROVED
    spec_version: "1.0.0"
    implementation: packages/python/vertex_core/src/vertex_core/calculations/portfolio.py::concentration
    method: normalized_group_weights_and_herfindahl_index
    assumptions:
      - "weights[g] = value[g] / sum(values), computed in a pinned 28-significant-digit Decimal context; herfindahl_index = sum(w^2)."
      - "The grouping (sector, issuer, asset class, ...) is the caller's choice; values must already be marked in one common currency."
      - "Values must be finite and non-negative; the summed value must be strictly positive (positive_denominator gate)."
      - "Passing already-normalized weights works unchanged, since weights are values normalized by their sum."
    parameter_schema:
      values_by_group: {type: "Mapping[str, Decimal]", unit: money_or_weight, constraint: "non-empty, non-empty string keys, finite values >= 0, sum > 0"}
