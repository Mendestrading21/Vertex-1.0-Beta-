  - id: risk.covariance
    owner: portfolio_risk
    inputs: [aligned_returns, estimator, lookback]
    output_unit: covariance_matrix
    gates: [minimum_sample, point_in_time_universe]
    invariants: [symmetric, positive_semidefinite_within_tolerance]
    runtime_status: APPROVED
    spec_version: "1.0.0"
    implementation: packages/python/vertex_core/src/vertex_core/calculations/risk.py::covariance
    method: sample_covariance_ddof1_numpy_with_exact_symmetrization
    assumptions:
      - "S = centered.T @ centered / (n - 1) in float64 (numpy), then the exact symmetrization (S + S.T) / 2 after checking the raw asymmetry against the documented tolerance."
      - "aligned_returns is a complete rectangular matrix, one row per synchronous observation, one column per asset; alignment and the point-in-time universe are the caller's upstream duty. A hole is REJECTED, never replaced by zero."
      - "Only estimator='sample' has a real implementation; any other name raises EstimatorNotImplementedError (NOT_IMPLEMENTED, never a pending capability)."
      - "minimum_sample must be an int >= 2 because ddof = 1; Decimal input is converted to float64 with a relative error <= 2**-52."
      - "One population per call: one real universe snapshot or one hypothetical scenario set, never mixed."
    parameter_schema:
      aligned_returns: {type: "Sequence[Sequence[int | float | Decimal]]", unit: ratio_per_period, constraint: "rectangular, complete, finite; rows >= minimum_sample; at least one column"}
      estimator: {type: str, unit: enum, constraint: "only 'sample' is implemented, default 'sample'"}
      minimum_sample: {type: int, unit: observations, constraint: ">= 2, default 2, bool rejected"}
      returns: {type: CovarianceResult, unit: covariance, note: "estimator, n_observations, n_assets, ddof=1, matrix and min_eigenvalue"}
    tolerances:
      covariance_symmetry_tolerance: 1.0e-12
      covariance_psd_tolerance: 1.0e-10
      oracle_atol: 1.0e-15
      note: >-
        COVARIANCE_SYMMETRY_TOLERANCE (relative to max(1, max|S|)) and
        COVARIANCE_PSD_TOLERANCE (relative to max(1, max|eigenvalue|), checked
        with numpy.linalg.eigvalsh) are module constants of
        calculations/risk.py; the oracle test uses rtol=0.0 and atol=1e-15.
    oracle: numpy_cov_independent_implementation_in_test
    oracle_evidence: >-
      test_oracle_matches_numpy_cov (marker pytest.mark.oracle) compares the
      result with numpy.cov(rowvar=False, ddof=1) at atol=1e-15;
      test_golden_two_assets_hand_computed (marker pytest.mark.golden) carries
      the provenance comment "hand computation (documented 2026-08-28)".
