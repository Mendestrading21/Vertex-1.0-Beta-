      - packages/python/vertex_core/tests/calculations/test_options_properties.py
      - apps/worker/tests/test_options_content.py
      - apps/api/tests/test_option_chain.py
  - id: options.greeks
    owner: options
    inputs: [validated_pricing_problem]
    output_unit: documented_per_contract_units
    gates: [price_valid]
    invariants: [finite, delta_bounds, vanilla_gamma_vega_non_negative]
    runtime_status: APPROVED
    spec_version: "1.0.0"
    implementation: packages/python/vertex_core/src/vertex_core/calculations/options.py::greeks
    method: closed_form_bsm_sensitivities_erf
    assumptions:
      - "Analytic BSM sensitivities from the same d1/d2 as options.european_price, with math.erf for the CDF."
      - "RAW units: delta per +1 unit of underlying price; gamma per +1 unit squared; vega per +1.0 of annualized volatility; theta per +1 YEAR of elapsing calendar time (dV/dt = -dV/dT); rho per +1.0 of the continuously compounded rate."
      - "Derived views are exact transforms: vega_per_point = vega * 0.01, theta_per_calendar_day = theta / 365 (ACT/365F), rho_per_bp = rho * 0.0001; consistency is re-validated in the result model."
      - "maturity_years > 0 AND volatility > 0 are required: at expiry or at zero volatility the distributional sensitivities are undefined and the input is rejected (no step-function fallback)."
      - "Monetary exposures (multiplier x quantity x FX) are deliberately NOT computed here: they need the manual position declaration and a dated FX rate."
    parameter_schema:
      spot: {type: "int | float | Decimal", unit: price, constraint: "finite, in (0, 1e12]"}
      strike: {type: "int | float | Decimal", unit: price, constraint: "finite, in (0, 1e12]"}
      maturity_years: {type: "int | float | Decimal", unit: years_act365, constraint: "in (0, 100]"}
      rate: {type: "int | float | Decimal", unit: continuously_compounded_annualized_decimal, constraint: "in [-1, 1]"}
