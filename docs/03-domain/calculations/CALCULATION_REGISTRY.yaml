  - id: options.european_price
    owner: options
    reference: QuantLib
    inputs: [spot, strike, maturity, rate_curve, dividends, volatility, right]
    output_unit: price
    gates: [inside_model_domain]
    invariants: [bounds, put_call_parity, monotonicity, convexity]
    runtime_status: APPROVED
    spec_version: "1.0.0"
    implementation: packages/python/vertex_core/src/vertex_core/calculations/options.py::european_price
    method: closed_form_bsm_erf
    assumptions:
      - "Analytic Black-Scholes-Merton with flat continuously compounded rate r and dividend yield q; standard normal CDF via math.erf (no SciPy in the runtime pricing path)."
      - "d1 = [ln(S/K) + (r - q + vol^2/2) T] / (vol sqrt(T)), d2 = d1 - vol sqrt(T)."
      - "European exercise only; no discrete dividends; constant volatility."
      - "Documented deterministic boundary cases, not fallbacks: T == 0 returns the intrinsic value; vol == 0 returns the discounted deterministic bound max(+/-(S e^{-qT} - K e^{-rT}), 0); a vol*sqrt(T) that underflows float64 returns that same exact vol->0 limit."
      - "Validated model domain: spot and strike in (0, 1e12], T in [0, 100] years, vol in [0, 10], r and q in [-1, 1]."
      - "Tiny negative float rounding is normalized to 0.0 (the analytic price is provably non-negative)."
    parameter_schema:
      spot: {type: "int | float | Decimal", unit: price, constraint: "finite, in (0, 1e12]"}
      strike: {type: "int | float | Decimal", unit: price, constraint: "finite, in (0, 1e12]"}
      maturity_years: {type: "int | float | Decimal", unit: years_act365, constraint: "in [0, 100]"}
      rate: {type: "int | float | Decimal", unit: continuously_compounded_annualized_decimal, constraint: "in [-1, 1]"}
      dividend_yield: {type: "int | float | Decimal", unit: continuously_compounded_annualized_decimal, constraint: "in [-1, 1]"}
      volatility: {type: "int | float | Decimal", unit: annualized_decimal, constraint: "in [0, 10]"}
      right: {type: "OptionRight | str", unit: enum, constraint: "CALL or PUT"}
      returns: {type: float, unit: price}
    tolerances:
      float64_rel_tol: 1.0e-9
      float64_abs_tol: 1.0e-12
      oracle_tolerance: "max(1e-9 absolute, 1e-7 relative)"
      property_tol: "1e-9 * max(1, spot, strike)"
      note: >-
        within_oracle_tolerance in test_options_oracle.py is
        abs(a-b) <= max(1e-9, 1e-7 * max(|a|, |b|)); parity, monotonicity,
        convexity and the bounds are asserted with 1e-9 * max(1, s, k) in
        test_options_properties.py.
    oracle: quantlib_analytic_european
    oracle_evidence: >-
      TestEuropeanPriceThreeWayOracle compares three independent
      implementations on a 720-point grid per right (6 maturities x 5
      moneyness x 4 vols x 4 rates x 3 yields): the runtime math.erf closed
      form, QuantLib AnalyticEuropeanEngine on identical flat ACT/365F curves,
      and a scipy.stats.norm reference written in the test.
    criticality: critical
    tests:
      - packages/python/vertex_core/tests/calculations/test_options.py
      - packages/python/vertex_core/tests/calculations/test_options_oracle.py
      - packages/python/vertex_core/tests/calculations/test_options_properties.py
      - apps/worker/tests/test_options_content.py
  - id: options.american_price
    owner: options
    reference: QuantLib_finite_difference
    inputs: [spot, strike, maturity, curves, volatility, right, calendar]
    output_unit: price
    gates: [validated_numerical_grid]
    invariants: [bounds, american_not_below_european]
    runtime_status: APPROVED
    spec_version: "1.0.0"
    implementation: packages/python/vertex_core/src/vertex_core/calculations/options.py::american_price
    method: quantlib_fd_black_scholes
    assumptions:
      - "QuantLib FdBlackScholesVanillaEngine(process, tGrid=steps, xGrid=steps, dampingSteps=0) (Douglas scheme) on a BlackScholesMertonProcess with flat continuously compounded rate and dividend-yield curves, Actual365Fixed day count, NullCalendar and constant volatility."
      - "American exercise from the anchor date to expiry; QuantLib is a hard dependency of the quant extra and there is NO analytic fallback."
      - "Date grid: maturity_years must be an integral number of calendar days on the ACT/365F grid (a multiple of 1/365, float round-off up to FLOAT64_REL_TOL relative tolerated). An off-grid maturity is REJECTED (maturity_off_date_grid), never silently quantized; a positive maturity rounding to zero days is rejected (maturity_below_date_grid)."
      - "steps must be an int >= AMERICAN_MIN_STEPS (50) and applies to BOTH the time grid and the space grid; the default is 800."
      - "Discrete cash dividends are NOT_IMPLEMENTED: a non-empty discrete_dividends raises OptionNotImplementedError; they are never approximated by the continuous yield."
      - "volatility == 0 is rejected (the numerical grid degenerates); maturity_years == 0 returns the intrinsic value."
      - "The process-global QuantLib evaluationDate is saved and restored in a try/finally so no mutation leaks to other QuantLib users."
    parameter_schema:
      spot: {type: "int | float | Decimal", unit: price, constraint: "finite, in (0, 1e12]"}
      strike: {type: "int | float | Decimal", unit: price, constraint: "finite, in (0, 1e12]"}
      maturity_years: {type: "int | float | Decimal", unit: years_act365, constraint: "in [0, 100] and an integral multiple of 1/365"}
      rate: {type: "int | float | Decimal", unit: continuously_compounded_annualized_decimal, constraint: "in [-1, 1]"}
      dividend_yield: {type: "int | float | Decimal", unit: continuously_compounded_annualized_decimal, constraint: "in [-1, 1]"}
      volatility: {type: "int | float | Decimal", unit: annualized_decimal, constraint: "in (0, 10] when T > 0"}
      right: {type: "OptionRight | str", unit: enum, constraint: "CALL or PUT"}
      steps: {type: int, unit: grid_nodes, constraint: ">= 50, keyword-only, default 800, applies to tGrid and xGrid"}
      discrete_dividends: {type: Sequence, unit: money, constraint: "must be empty (NOT_IMPLEMENTED otherwise)"}
      returns: {type: float, unit: price}
    tolerances:
      cross_method_tol: 5.0e-3
      golden_tol: 2.0e-3
      registry_conformance_abs: 1.0e-10
      american_not_below_european_slack: "1e-3 * spot"
      american_tol_unit_tests: 5.0e-3
      grid_convergence: "<= 2 * 5e-3 between step counts"
      note: >-
        CROSS_METHOD_TOL = 5e-3 and GOLDEN_TOL = 2e-3 are constants of
        test_options_oracle.py; AMERICAN_TOL = 5e-3 is a constant of
        test_options.py. The runtime price must match an independently
        constructed FdBlackScholesVanillaEngine with abs=1e-10.
    oracle: quantlib_crr_second_method
    oracle_evidence: >-
      test_crr_second_numerical_method_agrees compares the runtime finite
      differences against an independent QuantLib binomial CRR tree at 800
      steps on an 8-point grid; test_golden_vectors_literature_american_put
      checks 5 golden vectors whose derivation is documented above
      AMERICAN_PUT_GOLDEN (two engines at tGrid=xGrid=4000 and CRR 8001 steps,
      agreeing within 8e-4, with the Longstaff-Schwartz 2001 Table 1
      cross-check at 4.48637); test_runtime_engine_is_registry_finite_difference
      pins the runtime to the declared reference method.
    criticality: critical
    tests:
      - packages/python/vertex_core/tests/calculations/test_options.py
      - packages/python/vertex_core/tests/calculations/test_options_oracle.py
      - packages/python/vertex_core/tests/calculations/test_options_properties.py
  - id: options.implied_volatility
    owner: options
    inputs: [observed_price, model_inputs, quote_side]
    output_unit: annualized_decimal
    gates: [price_inside_bounds, bracket_exists]
    invariants: [price_iv_price_round_trip, non_negative]
    runtime_status: APPROVED
    spec_version: "1.0.0"
    implementation: packages/python/vertex_core/src/vertex_core/calculations/options.py::implied_volatility
    method: brentq_root_finding_on_price
    assumptions:
      - "Inverts the SAME closed-form BSM pricer as options.european_price; the model assumptions of that entry apply unchanged."
      - "price_inside_bounds: the observed price must lie STRICTLY inside options.no_arbitrage_bounds; at or outside the bounds raises IVNoSolutionError."
      - "bracket_exists: the explicit bracket [IV_BRACKET_LO, IV_BRACKET_HI] = [1e-6, 5.0] is verified by evaluating the pricer at both edges; a price below the floor price or above the ceiling price raises IVNoSolutionError. No clamped or extrapolated volatility is ever returned."
      - "scipy.optimize.brentq with xtol=1e-12 and maxiter=200; non-convergence or a root outside the bracket raises IVNoSolutionError."
      - "maturity_years must be strictly positive: an expired option has no implied volatility."
      - "quote_side belongs to the closed catalogue BID/ASK/MID/LAST/MODEL; it does not change the mathematics but makes the provenance of the observed price explicit."
    parameter_schema:
      observed_price: {type: "int | float | Decimal", unit: price, constraint: "finite, strictly inside the no-arbitrage bounds"}
      spot: {type: "int | float | Decimal", unit: price, constraint: "finite, in (0, 1e12]"}
      strike: {type: "int | float | Decimal", unit: price, constraint: "finite, in (0, 1e12]"}
      maturity_years: {type: "int | float | Decimal", unit: years_act365, constraint: "in (0, 100]"}
      rate: {type: "int | float | Decimal", unit: continuously_compounded_annualized_decimal, constraint: "in [-1, 1]"}
      dividend_yield: {type: "int | float | Decimal", unit: continuously_compounded_annualized_decimal, constraint: "in [-1, 1]"}
      right: {type: "OptionRight | str", unit: enum, constraint: "CALL or PUT"}
      quote_side: {type: str, unit: enum, constraint: "BID, ASK, MID, LAST or MODEL"}
      returns: {type: float, unit: annualized_decimal, note: "inside [1e-6, 5.0]"}
    tolerances:
      brentq_xtol: 1.0e-12
      round_trip_relative: 1.0e-7
      volatility_recovery_abs: 1.0e-4
      unit_test_recovery_abs: 1.0e-9
      note: >-
        test_iv_round_trip_within_relative_tolerance asserts
        |reprice - price| <= 1e-7 * price, and |iv - vol| <= 1e-4 only where
        the inversion is well conditioned (price - lower >= 1e-4 * max(1, s));
        the nominal unit tests recover the input volatility with abs=1e-9.
    oracle: none_yet_round_trip_against_three_way_validated_pricer
    oracle_evidence: >-
      The objective function is options.european_price, itself validated
      three ways against QuantLib AnalyticEuropeanEngine and a scipy
      reference; the bracket edges come from options.no_arbitrage_bounds. The
      price -> IV -> price round trip is asserted within 1e-7 relative over a
      200-example Hypothesis domain.
    oracle_limitation: >-
      No independent IV SOLVER is used as an oracle (QuantLib
