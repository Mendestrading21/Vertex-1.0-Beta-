# Alembic configuration for vertex_persistence.
# No DSN lives here or anywhere in the repository: env.py reads
# VERTEX_DATABASE_URL (or VERTEX_TEST_DATABASE_URL) from the environment.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
version_path_separator = os
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
