[project]
name = "vertex-core"
version = "0.1.0"
description = "Vertex One — unique autorité Python des contrats et calculs financiers (analyse seulement, aucun ordre)."
# Cible runtime 3.13 (épinglée par uv.lock au LOT-01) ; plancher dev local 3.11.
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
quant = [
    "numpy>=1.26",
    "scipy>=1.12",
    "QuantLib>=1.36",
]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "jsonschema>=4.21",
    "PyYAML>=6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
