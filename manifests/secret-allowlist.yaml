schema_version: 1
# Exemptions LITTÉRALES de la porte `tools/check_secrets.py`.
#
# Une entrée ne vaut que pour un triplet exact chemin + code + extrait. Aucune
# exemption par répertoire, extension ou expression régulière n'est possible :
# déplacer ou modifier la valeur invalide l'exemption et rouvre l'alerte.
# Une exemption sans occurrence fait échouer la porte (dette morte interdite).
#
# `reason` est obligatoire et doit expliquer pourquoi la valeur n'est PAS un
# secret. « c'est un test » ne suffit pas : un vrai secret dans un test reste
# un vrai secret.
allow:
  - path: apps/ingress-tradingview/worker/test/security.test.mjs
    code: HIGH_ENTROPY_ASSIGNMENT
    match: cap-0123456789abcdef
    reason: >-
      Constante SYNTHETIC écrite dans le test lui-même pour vérifier que
      `timingSafeEqual` renvoie faux à chaque position altérée. La valeur est
      une suite hexadécimale ordonnée (0123456789abcdef), jamais émise par le
      générateur de capacités et sans contrepartie côté Cloudflare : elle
      n'ouvre aucune route.

  # ── Corpus de test du détecteur lui-même ────────────────────────────────
  # `tools/tests/test_check_secrets.py` DOIT contenir des valeurs en forme de
  # secret : sans elles, rien ne prouve que la porte détecte quoi que ce soit.
  # Chaque valeur est inerte et le motif ci-dessous dit pourquoi. Le choix
  # assumé est de les EXEMPTER explicitement plutôt que de les assembler à
  # l'exécution : une exemption laisse une trace auditable, un contournement
  # syntaxique n'en laisse aucune.
  - path: tools/tests/test_check_secrets.py
    code: PRIVATE_KEY
    match: "-----BEGIN RSA PRIVATE KEY-----"
    reason: >-
      En-tête PEM seul, suivi des quatre caractères « MIIE ». Aucun matériel
      cryptographique ne suit : la chaîne ne se décode en aucune clé.
  - path: tools/tests/test_check_secrets.py
    code: AWS_ACCESS_KEY
    match: AKIAIOSFODNN7EXAMPLE
    reason: >-
      Identifiant d'exemple publié par AWS dans sa propre documentation
      (suffixe littéral « EXAMPLE »). Il n'a jamais correspondu à un compte.
  - path: tools/tests/test_check_secrets.py
    code: JWT
    match: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.SflKxwRJSMeKKF2QT4fwpM
    reason: >-
      Jeton d'exemple de la spécification JWT — charge utile {"sub":"1234567890"}
      et signature TRONQUÉE, donc invalide. Aucun service ne l'accepte, et il
      ne désigne aucun sujet réel.
  - path: tools/tests/test_check_secrets.py
    code: DSN_PASSWORD
    match: R7h!qZ2mPx9Lw4Tv
    reason: >-
      Mot de passe inventé pour ce test, dans une URL pointant vers l'hôte
      fictif `db.internal` qui n'existe dans aucun environnement Vertex.
  - path: tools/tests/test_check_secrets.py
    code: HIGH_ENTROPY_ASSIGNMENT
    match: correcthorsebatterystaple
    reason: >-
      Phrase de passe d'exemple universellement publiée (bande dessinée xkcd
      936), utilisée ici pour prouver que le seuil d'entropie TOTALE attrape
      une valeur en mots ordinaires que le seuil par caractère laissait passer.
      Elle n'ouvre rien et n'a jamais été un mot de passe Vertex.
  - path: tools/tests/test_check_secrets.py
    code: HIGH_ENTROPY_ASSIGNMENT
    match: 9f3Kd2Lm8Qz7Xv4Bn1Rt6Yw0Hs5Jp
    reason: >-
      Chaîne inventée pour ce test, affectée à un `CLIENT_SECRET` qui n'existe
      dans aucune configuration : aucun fournisseur ne la reconnaît.

  # ── Mot de passe éphémère du service PostgreSQL de la CI ─────────────────
  - path: .github/workflows/ci.yml
    code: HIGH_ENTROPY_ASSIGNMENT
    match: vertex_ci_ephemeral
    reason: >-
      Même valeur que l'entrée DSN_PASSWORD ci-dessous, vue cette fois dans
      l'affectation `POSTGRES_PASSWORD:` du service. Mot de passe du conteneur
      PostgreSQL démarré PAR le job et détruit avec lui.
  - path: .github/workflows/ci.yml
    code: DSN_PASSWORD
    match: vertex_ci_ephemeral
    reason: >-
      Mot de passe du conteneur PostgreSQL démarré PAR le job et détruit avec
      lui. Le service n'écoute que sur le réseau interne du runner, ne contient
      que des données SYNTHETIC créées pendant le job, et n'existe plus quand
      le job se termine. Le rendre secret n'ajouterait aucune protection et
      retirerait la lisibilité du DSN dans le workflow.
