# Matrice de traçabilité des interdictions absolues.
#
# Chaque interdiction des documents sources est mappée à des PREUVES ou à un
# écart écrit. `tools/check_traceability.py` la garde honnête dans les deux
# sens : une règle sans entrée échoue, une entrée sans règle échoue, une
# citation qui ne résout pas échoue, et depuis le 9e audit le champ `text`
# est confronté mot pour mot à la règle qu'il recopie.
#
# Une citation DOIT nommer un test : `chemin::nom`. Une citation de fichier
# entier a longtemps suffi — 58 des 67 l'étaient — et un fichier vidé de ses
# tests serait resté vert.
schema_version: 1
invariants:
