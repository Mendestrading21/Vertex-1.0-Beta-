- id: PROBABILITE-CALIBREE-SAFETY
  digest: 7069c96a4743
  text: >-
    Une probabilité prédictive n’est affichée que si sa calibration, son horizon,
    sa population, sa validation hors échantillon et sa version sont présents
    et valides.
  status: NOT_YET_PROVEN
  owner: programme Vertex One
  reason: >-
    `research/tests/test_calibration.py` prouve la règle d'abstention côté recherche
    : une calibration invalide, instable ou d'échantillon insuffisant ne produit
    pas de probabilité. Mais AUCUNE probabilité prédictive n'atteint aujourd'hui
    l'interface, et aucun test ne prouve que l'interface REFUSERAIT d'en afficher
    une mal formée. La règle n'est donc pas prouvée là où elle doit l'être — au
    point d'affichage.
  expires_at: '2026-12-31'
  closure_criterion: >-
    Un test d'interface qui refuse d'afficher une probabilité dont l'un des cinq
    champs manque ou est invalide, et un test de contrat API qui la rejette avant
    l'interface.
