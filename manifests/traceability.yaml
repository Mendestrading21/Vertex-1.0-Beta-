  - id: COPIE-DU-DONNEUR
    digest: 1fc292836708
    text: "Copier globalement un fichier ou dossier du dépôt donneur sans inventaire, provenance, licence, tests indépendants et plan de rollback."
    status: NOT_YET_PROVEN
