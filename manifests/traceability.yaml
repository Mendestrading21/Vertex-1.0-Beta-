- id: ENTREE-DEFAILLANTE-FERME-LA-GATE
  digest: a14bb3fe12c6
  text: >-
    Une entrée requise absente, partielle, périmée, retardée, future, contradictoire
    ou sans droit ferme la gate concernée.
  status: PROVEN
  proofs:
  - >-
    packages/python/vertex_core/tests/decision/test_gates.py::test_missing_inputs_unevaluable
  - >-
    packages/python/vertex_core/tests/data/test_quality.py::test_unassessed_delay_dimension_fails_closed
  - >-
    packages/python/vertex_core/tests/data/test_freshness.py::test_stale_beyond_open_ttl
  - >-
    apps/worker/tests_integration/test_chaos_degradation.py::test_une_population_perimee_ne_produit_jamais_un_avis_affirmatif
  note: >-
    Prouvé À L'ÉVALUATION : une entrée absente, périmée, non évaluée ou sans droit
    ferme la gate concernée, sur les quatre couches citées. NON prouvé À LA RELECTURE
    : un dossier déjà publié n'est pas réévalué quand ses entrées vieillissent
    — mesuré à +71 h, voir `EXCEPTION-JAMAIS-QUALIFIED`. La règle porte sur la
    fermeture de la gate, qui est bien prouvée ; ce que cette entrée ne couvre
    pas est la durée de vie du verdict qui en découle.
