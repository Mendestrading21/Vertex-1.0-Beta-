    des concaténations de chaînes, 9 injections à détecter et 6 à ignorer), et
    `no-uncalibrated-probability.test.ts` réserve la lecture de `probability_evidence`.
    Une version antérieure de cette note affirmait qu'« un balayage statique du
    dépôt web n'existe pas » : c'est faux depuis `fdc9dfc`. NON couvert : les
    deux gardes lisent `apps/web/src` et rien d'autre, et elles ne voient pas
    une expression construite dynamiquement.
