  - id: FRAMEWORK-SANS-ADR
    digest: d21cce8876f7
    text: "Ajouter un framework, une base ou un service sans ADR."
    status: NOT_YET_PROVEN
    owner: programme Vertex One
    reason: >-
      `tools/check_policy.py` prouve qu'une dépendance est épinglée et
      verrouillée, et `check_notices.py` qu'elle est inventoriée avec sa
      licence. Aucune des deux ne vérifie qu'un ADR ACCEPTÉ l'autorise :
      `manifests/dependencies.yaml` déclare les adoptions, mais rien ne relie
      une entrée de verrou à une décision d'architecture.
    expires_at: "2026-12-31"
    closure_criterion: >-
      Une porte qui exige, pour chaque dépendance de premier niveau ajoutée,
      une entrée dans `manifests/dependencies.yaml` référençant un ADR existant
      au statut accepté, et un test prouvant qu'une dépendance sans ADR échoue.

  - id: JAMAIS-MAIN-NI-FUSION-SANS-HUMAIN
    digest: dbac67cdd545
    text: "Travailler directement sur `main`, force-push, fusionner ou publier sans validation humaine."
    status: NOT_PROVABLE_BY_TEST
    owner: programme Vertex One
    reason: >-
      Cette règle porte sur des actions qui se produisent HORS du dépôt : les
      protections de branche, les droits de fusion et l'approbation humaine
      vivent dans la configuration GitHub, qu'aucun test exécuté dans un
      checkout ne peut lire ni contraindre. Un test qui prétendrait la prouver
      mesurerait autre chose et donnerait une fausse assurance.
      Ce qui EST vérifié par ailleurs : `tools/check_repository_role.py`
      empêche d'écrire dans le dépôt donneur, et `tools/check_policy.py` refuse
      un workflow qui exécuterait du code de PR non fiable ou qui s'accorderait
      des permissions en écriture sans motif écrit. La protection de `main`
      elle-même reste une configuration humaine, à vérifier humainement.
