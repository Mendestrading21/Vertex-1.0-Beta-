# Matrice de traçabilité — interdiction → preuve.
#
# Autorité de la porte `tools/check_traceability.py`.
#
# Chaque entrée est indexée par le CONDENSÉ du texte exact de la règle, dans
# `CLAUDE.md § Interdictions absolues` et `.claude/rules/financial-safety.md`.
# Modifier une règle change son condensé : la porte signale alors à la fois
# l'interdiction non déclarée et l'entrée devenue orpheline, ce qui force à
# relire la correspondance au lieu de la reconduire.
#
# `status` :
#   PROVEN                — au moins une preuve, chaque citation résolue.
#   NOT_YET_PROVEN        — aucune preuve encore ; exige propriétaire, motif,
#                           échéance et critère de clôture.
#   NOT_PROVABLE_BY_TEST  — aucun test ne peut la prouver ici ; exige un
#                           propriétaire et un argument écrit.
#
# Une preuve s'écrit `chemin` (le fichier entier prouve la règle) ou
# `chemin::nom_de_test`. Une citation qui ne résout pas fait échouer la porte :
# elle ressemblerait à une couverture.
#
# Les entrées non prouvées sont IMPRIMÉES à chaque exécution, même quand la
# porte passe.
