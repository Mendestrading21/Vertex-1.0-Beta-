schema_version: 1
# Exemptions NOMMÉES de la porte `tools/check_financial_boundary.py`.
#
# La porte signale toute façon d'ATTEINDRE une capacité IBKR interdite —
# appel, accès d'attribut, import, mention littérale, fragment de route.
# `call`, `attribute` et `import` ne sont JAMAIS exemptables : ils obtiennent
# la référence. Seules la mention (`string`, `reference`) et le fragment de
# route peuvent l'être, et seulement fichier par fichier, symbole par symbole.
#
# Les exempter NOMMÉMENT vaut mieux que d'écarter des répertoires entiers :
# `SKIP_PARTS` écartait `tests` et `tools`, si bien qu'un appel interdit écrit
# dans n'importe quel test passait la porte la plus critique du programme
# (6e audit adversarial). Le manifeste déclare
# `scope: [runtime, tests, dependencies, routes, permissions, ai_tools]`.
#
# Une entrée peut porter `symbol:` (un symbole) ou `symbols:` (plusieurs, même
# fichier, même forme, même motif). La forme liste ne relâche rien : chaque
# symbole reste écrit, il n'existe aucun joker. Elle évite de répéter
# cinquante fois le même motif — une allowlist illisible n'est plus relue, et
# c'est ainsi que le 7e audit a trouvé une exemption qui couvrait autre chose
# que ce qu'elle annonçait.
#
# Une exemption sans occurrence est signalée comme dette morte : un fichier
# renommé ou nettoyé ne doit pas laisser derrière lui une exemption qui
# couvrirait autre chose.
#
# `reason` est obligatoire. « c'est un test » ne suffit pas : un appel interdit
# dans un test reste un appel interdit.
allow:
  - path: apps/edge-ibkr/tests/test_denylist.py
    symbols:
      - "accountSummary"
      - "cancelOrder"
      - "completedOrders"
      - "executions"
      - "exerciseOptions"
      - "managedAccounts"
      - "openOrders"
      - "placeOrder"
      - "reqAccountSummary"
      - "reqAccountUpdates"
      - "reqAccountUpdatesMulti"
      - "reqAllOpenOrders"
      - "reqAutoOpenOrders"
      - "reqCompletedOrders"
      - "reqExecutions"
      - "reqGlobalCancel"
      - "reqIds"
      - "reqOpenOrders"
      - "reqPnL"
      - "reqPnLSingle"
      - "reqPositions"
      - "reqPositionsMulti"
      - "whatIfOrder"
    kind: string
    reason: >-
      Test qui prouve l'ABSENCE de ces capacites dans le code de production. Il les
      nomme en CHAINES uniquement, jamais en appel, en attribut ni en import,
      precisement pour ne pas creer lui-meme le chemin qu'il interdit.
  - path: manifests/current-vertex-salvage.yaml
    symbol: "positions"
    kind: reference
    reason: >-
      Inventaire du depot donneur : il decrit les lectures compte/positions du
      Vertex actuel comme dette a NE PAS reprendre. Texte d'inventaire, aucun code.
  - path: manifests/financial-boundary-allowlist.yaml
    symbols:
      - "/iserver/account/order"
      - "/iserver/account/orders"
      - "/iserver/account/pnl"
      - "/iserver/account/trades"
      - "/pa/performance"
    kind: fragment
    reason: >-
      Ce fichier d'exemptions lui-même. Il cite chaque symbole qu'il exempte
      ailleurs ; la citation est la mention, jamais un chemin vers la capacité.
