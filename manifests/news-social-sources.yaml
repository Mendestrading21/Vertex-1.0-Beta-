      hard_global_purge_deadline: PT48H
      reversible_aggregate_ttl: PT24H_DEFAULT
      deletion_deadline: IMMEDIATE_ON_DETECTION_AND_BEFORE_PT48H
      backup_policy: exclude_all_reddit_content
