    retention:
      raw_api_response_ttl: PT24H
      permitted_series_observations_ttl: INDEFINITE_IF_SERIES_RIGHTS_ALLOW
      copyrighted_series_cache_ttl: PT24H_PERSONAL_USE_ONLY
      derived_macro_ttl: SAME_AS_SOURCE_SERIES_RIGHTS
      backup_policy: permitted_only_for_allowlisted_series
    derived_fields:
      - point_in_time_change
      - point_in_time_zscore
      - macro_regime_context
