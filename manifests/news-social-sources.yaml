schema_version: 1
policy_id: vertex-one-news-social-sources
reviewed_at: "2026-08-28"
policy_owner: data_governance
status_values: [ACTIVE, OPTIONAL, UNSUPPORTED]
runtime_availability_values:
  - AVAILABLE
  - DELAYED
  - NOT_ENTITLED
  - UNSUPPORTED
  - STALE
  - ERROR

global_rules:
  official_interfaces_only: true
  scraping: forbidden
  browser_sessions_as_data_source: forbidden
  undocumented_endpoints: forbidden
  entitlement_bypass: forbidden
  private_social_data: forbidden
  social_write_actions: forbidden
  ai_training_on_source_content: forbidden
  secrets_in_logs_or_database: forbidden
  stricter_contract_wins: true
  unknown_rights_action: disable_and_purge_content
  social_context_only: true
  social_can_qualify_decision: false
  social_can_set_direction: false
  raw_social_in_long_term_backups: false
  licensed_article_bodies_in_long_term_backups: false

cross_source_policy:
  primary_confirmation_tiers: [P0_REGULATORY_PRIMARY, P1_SUBSCRIBED_STRUCTURED]
  social_tier: P3_PUBLIC_CONVERSATION
  social_plus_social_is_primary_confirmation: false
  syndication_counts_as_one_source: true
  entity_resolution_requires_canonical_id: true
  ticker_alone_is_sufficient_identity: false
  unresolved_conflict_action: BLOCK_RELEVANT_GATE
  allowed_cluster_states:
    - UNVERIFIED_SOCIAL
    - CORROBORATED
    - PRIMARY_CONFIRMED
    - CONTRADICTED

bot_spam_policy:
  purpose: corpus_quality_only
  labels_people_as_bots: false
  allowed_output: [LOW, MEDIUM, HIGH, UNKNOWN]
  allowed_signals:
    - exact_or_near_duplicate_content
    - temporal_burstiness
    - shared_link_concentration
    - author_and_domain_concentration
    - engagement_anomaly_if_contract_allows
    - cross_source_divergence
  prohibited_signals:
    - sensitive_attribute_inference
    - cross_platform_identity_linking
    - private_data
  x_specific_rule: "Ne jamais identifier publiquement bot, spam ou violation sans permission écrite de X."

sources:
  - id: ibkr_news
    name: IBKR News API
    category: [news, company, etf]
    evidence_tier: P1_SUBSCRIBED_STRUCTURED
    default_status: ACTIVE
    activation_gate: "reqNewsProviders retourne au moins un fournisseur autorisé et ses conditions sont enregistrées."
    scope:
      - subscribed_provider_codes
      - contract_specific_live_headlines
      - broad_tape_headlines
      - historical_headlines
      - article_on_demand
    auth:
      type: tws_local_authenticated_session
      secret_location: operating_system_secret_store
      permissions: read_only_information
      prohibited_permissions: [account, portfolio, positions, pnl, orders, executions]
    rights:
      basis: provider_specific_api_subscription
      entitlement_probe: reqNewsProviders
      commercial_use: contract_dependent
      redistribution: forbidden_by_default
      article_body_storage: forbidden_by_default
      ai_processing: forbidden_without_explicit_written_right
      attribution: provider_required
    human_cost:
      setup: "Vérifier et sélectionner manuellement les abonnements API dans le portail IBKR."
      monetary: variable_free_or_paid_by_provider_and_user
      recurring: quarterly_terms_and_entitlement_review
    freshness:
      mode: event_stream_and_on_demand_history
      expected: provider_defined
      sla: none
      required_timestamps: [provider_published_at, received_at]
      pacing: ibkr_documented_limits
    retention:
      raw_article_body_ttl: NONE_BY_DEFAULT
      encrypted_display_cache_ttl: PT24H
      headline_ttl: PT24H
      native_id_and_provenance_ttl: P30D
      derived_cluster_ttl: P90D_IF_PROVIDER_TERMS_ALLOW
      deletion_deadline: CONTRACT_OR_ENTITLEMENT_END
      backup_policy: exclude_licensed_content
    derived_fields:
      - entity_links
      - event_category
      - novelty
      - watchlist_relevance
      - duplicate_cluster_id
      - independent_provider_count
      - freshness_state
    safeguards:
      - no_news_method_outside_documented_api
      - no_content_in_logs_fixtures_screenshots_or_exports
      - no_provider_content_sent_to_ai_without_written_right
      - no_fallback_when_not_entitled
      - provider_sentiment_never_becomes_vertex_verdict
    official_links:
      - label: Current TWS API documentation
        url: https://www.interactivebrokers.com/campus/ibkr-api-page/twsapi-doc/
      - label: Official News API reference
        url: https://interactivebrokers.github.io/tws-api/news.html
      - label: Subscription management
        url: https://www.interactivebrokers.com/campus/trading-lessons/subscribing-to-data/
      - label: Research and News offerings
        url: https://www.interactivebrokers.com/en/pricing/research-news-services.php

  - id: ibkr_wsh
    name: IBKR Wall Street Horizon
    category: [corporate_calendar, company, options, etf]
    evidence_tier: P1_SUBSCRIBED_STRUCTURED
    default_status: ACTIVE
    activation_gate: "L'entitlement WSH est disponible et la politique fournisseur est enregistrée."
    scope:
      - earnings_dates
      - dividend_dates
      - splits_and_spinoffs
      - options_expirations
      - investor_conferences
      - other_documented_corporate_events
    auth:
      type: tws_local_authenticated_session
      permissions: read_only_information
      prohibited_options: [fillPortfolio]
      universe_source: canonical_vertex_instrument_ids
    rights:
      basis: provider_specific_entitlement_via_ibkr
      commercial_use: contract_dependent
      redistribution: forbidden_by_default
      storage: contract_dependent
      ai_processing: forbidden_without_explicit_written_right
    human_cost:
      setup: "Vérifier manuellement l'entitlement et les frais WSH dans IBKR."
      monetary: variable_subscription
      recurring: quarterly_terms_and_entitlement_review
    freshness:
      mode: request_response_with_revisions
      expected: provider_defined
      sla: none
      refresh: bounded_schedule_respecting_ibkr_pacing
    retention:
      raw_payload_ttl: PT24H
      normalized_event_ttl: P30D_AFTER_EVENT
      revision_evidence_ttl: P1Y_IF_PROVIDER_TERMS_ALLOW
      deletion_deadline: CONTRACT_OR_ENTITLEMENT_END
      backup_policy: exclude_raw_payload
    derived_fields:
      - days_to_event
      - event_risk_window
      - date_change
      - certainty_state
      - cross_source_conflict
      - related_instrument_ids
    safeguards:
      - fillPortfolio_is_always_false
      - no_account_position_or_watchlist_inference
      - estimated_date_never_rendered_as_confirmed
      - no_calendar_redistribution
      - no_silent_fallback_when_not_entitled
    official_links:
      - label: Current TWS API documentation
        url: https://www.interactivebrokers.com/campus/ibkr-api-page/twsapi-doc/
      - label: WSH corporate events
        url: https://interactivebrokers.github.io/tws-api/fundamentals.html
      - label: WSH filters
        url: https://interactivebrokers.github.io/tws-api/wshe_filters.html

  - id: sec_edgar
    name: SEC EDGAR
    category: [regulatory_filings, company, fundamentals, etf]
    evidence_tier: P0_REGULATORY_PRIMARY
    default_status: ACTIVE
    activation_gate: "User-Agent déclaré, contact valide, rate limiter et correction hebdomadaire testés."
    scope:
      - submissions_history
      - filing_metadata
      - company_identity
      - xbrl_company_facts
      - xbrl_company_concepts
      - official_company_and_etf_filings
    auth:
      type: none
      required_headers:
        User-Agent: "VertexOne contact@example.invalid"
        Accept-Encoding: gzip
      note: "Le contact d'exemple doit être remplacé localement avant activation."
    rights:
      basis: public_regulatory_access
      access_cost: free
      redistribution: link_and_facts_with_provenance
      personal_data: minimize
      correction_obligation: post_acceptance_corrections_and_deletions
      attribution: SEC_EDGAR_and_accession
    human_cost:
      setup: "Configurer un contact réel et valider les formulaires/faits utilisés."
      monetary: none
      recurring: weekly_correction_sync_and_quarterly_scope_review
    freshness:
      submissions_typical_delay: LT1S_NOT_SLA
      xbrl_typical_delay: LT1M_NOT_SLA
      bulk_refresh: nightly_approximately_0300_ET
      hard_rate_limit: 10_requests_per_second
      internal_rate_limit: lower_than_official_maximum
    retention:
      raw_api_response_ttl: PT24H
      accession_and_filing_metadata_ttl: INDEFINITE_WITH_PROVENANCE
      validated_xbrl_facts_ttl: INDEFINITE_WITH_PROVENANCE
      derived_facts_ttl: INDEFINITE_WITH_CALCULATION_VERSION
      correction_check: P7D
      backup_policy: permitted_for_validated_public_facts
    derived_fields:
      - filing_event
      - xbrl_fact_delta
      - fiscal_period
      - xbrl_quality_state
      - company_name_and_ticker_change
      - canonical_entity_links
    safeguards:
      - use_data_sec_gov_indexes_or_official_archives_only
      - no_html_search_scraping
      - preserve_units_period_taxonomy_amendment_and_accession
      - weekly_post_acceptance_correction_sync
      - no_individual_profiling
      - ratios_only_in_python_vertex_core
    official_links:
      - label: EDGAR APIs
        url: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
      - label: Accessing EDGAR and Fair Access
        url: https://www.sec.gov/search-filings/edgar-search-assistance/accessing-edgar-data
      - label: SEC developer resources
        url: https://www.sec.gov/about/developer-resources

  - id: fred_alfred
