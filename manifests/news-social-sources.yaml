      unidentified_traffic: forbidden
    rights:
      basis: reddit_approval_plus_data_api_terms_and_responsible_builder_policy
      approval_required: true
      commercial_use: written_permission_and_contract_required
      broader_access: may_be_paid
      ai_training: forbidden_without_explicit_reddit_consent
      redistribution: forbidden_by_vertex_default
      deleted_content_retention: forbidden_even_if_deidentified
