    auth:
      type: api_key
      registration: fred_account
      secret_location: operating_system_secret_store
      key_policy: distinct_key_per_application_or_user_as_required
    rights:
      basis: fred_api_terms_plus_series_owner_terms
      access_cost: free_registration
      redistribution: per_series_only
      copyrighted_series: personal_use_only_unless_owner_permission
      attribution: FRED_and_original_data_owner
      endorsement_claim: forbidden
    human_cost:
      setup: "Créer la clé et auditer propriétaire/copyright/attribution de chaque série."
