# GÉNÉRÉ par `python3 tools/check_notices.py --refresh`. Chaque licence
# vient de la métadonnée publiée par le distributeur lui-même :
#   Python     https://pypi.org/pypi/<nom>/<version>/json
#              (license_expression, à défaut license, à défaut classifiers)
#   JavaScript https://registry.npmjs.org/<nom>/<version> (champ license)
