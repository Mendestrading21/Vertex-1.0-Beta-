[project]
name = "vertex-api"
version = "0.1.0"
description = "Vertex 1.0 Beta — HTTP API (read-only relays over published snapshots)."
requires-python = ">=3.11"
dependencies = [
    # Résolus depuis le workspace du monorepo, jamais depuis un index externe.
    "vertex-core>=0.1.0",
    "vertex-persistence>=0.1.0",
    "fastapi>=0.115,<1",
    "starlette>=0.41",
    "pydantic>=2.7,<3",
    "SQLAlchemy>=2.0,<3",
    "uvicorn>=0.30",
    # Passkey (WebAuthn) — aucune capacité transactionnelle.
    "webauthn>=3.0,<4",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "psycopg>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
