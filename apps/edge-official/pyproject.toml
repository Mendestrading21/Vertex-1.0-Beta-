[project]
name = "vertex-edge-official"
version = "0.1.0"
description = "Vertex 1.0 Beta — adaptateurs lecture seule pour sources officielles autorisées."
requires-python = ">=3.11"
dependencies = [
    "vertex-core>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
