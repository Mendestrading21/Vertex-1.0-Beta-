# Portes NOCTURNES de Vertex 1.0 Beta.
#
# `docs/06-quality/CI_GATES.md` : « Nuit : Firefox/WebKit, visuels, mutations,
# charge, pannes et tests de données. » Ces portes sont trop lentes pour
# bloquer chaque poussée, mais LOT-23 les exige avant toute release candidate.
#
# Même discipline que `ci.yml` : chaque action épinglée à un SHA de commit
# COMPLET résolu par `git ls-remote <dépôt> refs/tags/<tag>^{}`, images par
# digest immuable, `permissions: read-all`, timeout sur chaque job, aucun
# runner auto-hébergé.
#
# POURQUOI CE WORKFLOW EXISTE SÉPARÉMENT : les binaires Firefox et WebKit ne
# sont PAS téléchargeables depuis l'environnement de développement (le CDN
# Playwright n'y est pas joignable). Ces deux moteurs ne peuvent donc être
# éprouvés qu'ici. Tant que ce workflow n'a pas tourné vert, la couverture
# navigateur du produit se limite à Chromium — et cela reste écrit dans
# `docs/99-status/DEBT.md`.

name: nightly

on:
  schedule:
    # 03:17 UTC — décalé de l'heure ronde pour ne pas concourir avec la file
    # d'attente des tâches planifiées de GitHub.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"
  PNPM_VERSION: "10.33.0"

jobs:
  cross-browser:
    name: e2e — Firefox et WebKit (LOT-23)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: vertex
          POSTGRES_PASSWORD: vertex_ci_ephemeral
          POSTGRES_DB: vertex_e2e
        options: >-
          --health-cmd "pg_isready -U vertex -d vertex_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432
    env:
      VERTEX_TEST_DATABASE_URL: postgresql+psycopg://vertex:vertex_ci_ephemeral@127.0.0.1:5432/vertex_e2e
      # Sans cette variable, les deux projets n'existent pas dans la
      # configuration Playwright — voir apps/web/playwright.config.ts.
      VERTEX_CROSS_BROWSER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: uv
        uses: astral-sh/setup-uv@2ddd2b9cb38ad8efd50337e8ab201519a34c9f24 # v7.1.1
        with:
          enable-cache: false

      - name: pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Installation Python depuis le verrou exact
        run: uv sync --locked --all-extras --python ${{ env.PYTHON_VERSION }}

      - name: Installation web depuis le verrou exact
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      # `global.setup.ts` démarre le pipeline réel en invoquant `python3`.
      - name: Interpréteur verrouillé en tête de PATH
        run: echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

      # CHROMIUM EST OBLIGATOIRE ICI, même si ce job existe pour les deux
      # autres moteurs. `e2e/global.setup.ts` crée la première passkey via
      # l'authentificateur WebAuthn VIRTUEL, qui passe par CDP — un protocole
      # Chromium. Sans lui, le setup échoue avant qu'un seul test Firefox ou
      # WebKit ne démarre. C'est exactement ce qui s'est produit au tout
      # premier passage de ce workflow : `chromium.launch()` a échoué à
      # `global.setup.ts:169`.
      #
      # Les projets Chromium tournent d'ailleurs aussi dans ce job — l'étape
      # suivante s'appelle « les trois moteurs de rendu ».
      - name: Navigateurs Chromium, Firefox et WebKit
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Les 13 routes sur les trois moteurs de rendu
        working-directory: apps/web
        run: pnpm exec playwright test

      - name: Artefacts d'échec (tout est SYNTHETIC, aucune donnée réelle)
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: nightly-e2e-artifacts
          path: apps/web/e2e-artifacts/
          retention-days: 7
          if-no-files-found: ignore
