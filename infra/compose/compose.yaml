# Exécution locale de Vertex 1.0 Beta — machine personnelle, boucle locale.
#
# INVARIANTS TENUS ICI
# - toutes les images sont épinglées par digest immuable, jamais par tag seul ;
# - les services applicatifs (api, worker, web) tournent en utilisateur non
#   privilégié, déclaré dans leurs Dockerfiles (USER 10001 / 65532) ;
# - le service `db` démarre en root : l'entrypoint officiel de l'image
#   PostgreSQL a besoin de root pour préparer /var/lib/postgresql avant de
#   dégrader le processus serveur vers l'utilisateur `postgres`. `user: "999"`
#   le casserait au premier démarrage sur volume vide. Il est donc laissé tel
#   quel, avec le minimum de capacités restantes déclaré ci-dessous — et cette
#   exception est ÉCRITE, pas passée sous silence ;
# - chaque port est publié sur 127.0.0.1 UNIQUEMENT : les processus écoutent
#   l'interface de leur conteneur, mais rien n'est joignable depuis le LAN ;
# - aucun secret n'est écrit ici : les variables sans valeur par défaut font
#   échouer le démarrage si elles manquent (`${VAR:?message}`) ;
# - le système de fichiers applicatif est en lecture seule ; ce qui doit être
#   écrit l'est dans un tmpfs déclaré ;
# - `edge-ibkr` n'est PAS ici : il joint TWS sur la boucle locale de l'hôte ;
# - TROIS rôles PostgreSQL distincts, jamais confondus. `POSTGRES_USER` de
#   l'image officielle est un SUPERUTILISATEUR et le propriétaire de tout ce
#   que la première connexion crée. Tant que `api` et `worker` s'en servaient,
#   ils POSSÉDAIENT les tables append-only, donc pouvaient exécuter
#   `ALTER TABLE snapshots DISABLE TRIGGER snapshots_append_only` puis réécrire
#   l'historique. Désormais :
#     `VERTEX_DB_SUPERUSER`   amorçage seul, crée les deux autres rôles ;
#     `VERTEX_DB_MIGRATE_USER` propriétaire du schéma, utilisé PAR ALEMBIC SEUL
#                              (service `migrate` ci-dessous) ;
#     `VERTEX_DB_RUNTIME_USER` utilisé par `api` et `worker`, ne possède RIEN.
#   Provisionnement : `initdb/10-least-privilege-roles.sh` (premier démarrage)
#   puis la migration `0007_least_privilege_grants`. Preuve exécutable :
#   `infra/compose/check-least-privilege.sh`.
#
# Se lance depuis la RACINE du dépôt :
#   docker compose -f infra/compose/compose.yaml --env-file .env up

name: vertex-one

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: unless-stopped

services:
  db:
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    security_opt: ["no-new-privileges:true"]
    # Démarre en root (voir l'exception écrite en tête de fichier), mais sans
    # aucune capacité au-delà de celles dont l'entrypoint a besoin pour changer
    # de propriétaire et d'utilisateur.
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    restart: unless-stopped
    environment:
      # Rôle d'AMORÇAGE uniquement : superutilisateur, jamais utilisé par un
      # service applicatif ni par les sauvegardes.
      POSTGRES_USER: ${VERTEX_DB_SUPERUSER:?VERTEX_DB_SUPERUSER requis}
      POSTGRES_PASSWORD: ${VERTEX_DB_SUPERUSER_PASSWORD:?VERTEX_DB_SUPERUSER_PASSWORD requis}
      POSTGRES_DB: ${VERTEX_DB_NAME:?VERTEX_DB_NAME requis}
      # Lus par `initdb/10-least-privilege-roles.sh` au premier démarrage.
      VERTEX_DB_MIGRATE_USER: ${VERTEX_DB_MIGRATE_USER:?VERTEX_DB_MIGRATE_USER requis}
      VERTEX_DB_MIGRATE_PASSWORD: ${VERTEX_DB_MIGRATE_PASSWORD:?VERTEX_DB_MIGRATE_PASSWORD requis}
      VERTEX_DB_RUNTIME_USER: ${VERTEX_DB_RUNTIME_USER:?VERTEX_DB_RUNTIME_USER requis}
      VERTEX_DB_RUNTIME_PASSWORD: ${VERTEX_DB_RUNTIME_PASSWORD:?VERTEX_DB_RUNTIME_PASSWORD requis}
      # Horodatage : le stockage est en UTC, la conversion est un choix
      # d'affichage fait à l'interface, jamais dans la base.
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      # WAL archivable : prérequis du RPO ≤ 5 min visé par le runbook
      # docs/08-runbooks/BACKUP_RESTORE.md. L'archivage lui-même est activé
      # au LOT-24, sur la machine cible.
      - -c
      - wal_level=replica
      - -c
      - summarize_wal=on
    volumes:
      - db-data:/var/lib/postgresql/data
      # L'entrypoint officiel exécute ces fichiers à la PREMIÈRE initialisation
      # d'un volume vide. Monté en lecture seule : le conteneur ne peut pas les
      # réécrire.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${VERTEX_DB_PORT:-5432}:5432"
    healthcheck:
      # `pg_isready` répond « accepting connections » AVANT de savoir si la
      # base est utilisable : il n'authentifie pas et n'exécute aucune requête.
      # Il déclarait donc sain un serveur dont le provisionnement des rôles
      # avait échoué. On exécute une vraie requête ET on exige que le rôle de
      # runtime existe : sans lui, `api` et `worker` ne peuvent pas démarrer.
      test:
        - CMD-SHELL
        - >-
          psql -q -tA --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
          -c "SELECT 1 FROM pg_roles WHERE rolname = '$${VERTEX_DB_RUNTIME_USER}'"
          | grep -q '^1$$'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Migrations : le SEUL service qui utilise le rôle propriétaire. Il tourne
  # une fois, jusqu'à `head`, puis s'arrête. `api` et `worker` attendent sa
  # sortie réussie — sans quoi ils démarreraient sur un schéma incomplet, ou
  # sans les droits que `0007_least_privilege_grants` leur pose.
  migrate:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.python
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: "no"
    depends_on:
      db: {condition: service_healthy}
    environment:
      VERTEX_ENV: ${VERTEX_ENV:?VERTEX_ENV requis}
      # DSN du rôle PROPRIÉTAIRE. Il ne doit apparaître nulle part ailleurs.
      VERTEX_DATABASE_URL: ${VERTEX_MIGRATION_DATABASE_URL:?VERTEX_MIGRATION_DATABASE_URL requis}
      # Nom du rôle de runtime auquel la migration 0007 accorde les droits.
      VERTEX_DB_RUNTIME_USER: ${VERTEX_DB_RUNTIME_USER:?VERTEX_DB_RUNTIME_USER requis}
    command:
      - python
      - -m
      - alembic
      - -c
      - packages/python/vertex_persistence/alembic.ini
      - upgrade
      - head
    tmpfs: ["/tmp:size=64m,mode=1777"]

  api:
    <<: *hardening
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.python
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    environment:
      VERTEX_ENV: ${VERTEX_ENV:?VERTEX_ENV requis}
      # DSN du rôle de RUNTIME : il ne possède aucune table et ne peut pas
      # désactiver un déclencheur append-only.
      VERTEX_DATABASE_URL: ${VERTEX_DATABASE_URL:?VERTEX_DATABASE_URL requis}
      # Compose publie web et API sur deux ports loopback. Le port web est
      # explicitement autorisé pour le contrôle Origin/Host en environnement
      # local, et le cookie HTTP n'est permis qu'avec VERTEX_ENV=dev.
      VERTEX_AUTH_DEV_ORIGIN_PORTS: ${VERTEX_WEB_PORT:-4173}
      VERTEX_AUTH_COOKIE_INSECURE_DEV: "1"
    command:
      - python
      - -m
      - uvicorn
      - vertex_api.app:create_app
      - --factory
      - --host
      - "0.0.0.0"   # à l'intérieur du conteneur ; la publication reste loopback
      - --port
      - "8000"
    tmpfs: ["/tmp:size=64m,mode=1777"]
    ports:
      - "127.0.0.1:${VERTEX_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: *hardening
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.python
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    environment:
      VERTEX_ENV: ${VERTEX_ENV:?VERTEX_ENV requis}
      # DSN du rôle de RUNTIME : il ne possède aucune table et ne peut pas
      # désactiver un déclencheur append-only.
      VERTEX_DATABASE_URL: ${VERTEX_DATABASE_URL:?VERTEX_DATABASE_URL requis}
    command: ["python", "-m", "vertex_worker"]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    # Aucun port : le worker ne sert rien, il consomme l'outbox.

  web:
    <<: *hardening
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.web
    depends_on:
      api: {condition: service_healthy}
    environment:
      VERTEX_API_UPSTREAM: http://api:8000
      VERTEX_WEB_HOST: 0.0.0.0
      VERTEX_WEB_PORT: 4173
    ports:
      - "127.0.0.1:${VERTEX_WEB_PORT:-4173}:4173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  db-data:
