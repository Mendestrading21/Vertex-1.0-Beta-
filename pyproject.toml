# Racine du monorepo Vertex 1.0 Beta — configuration outillage.
#
# Ce projet racine n'est PAS distribuable (`tool.uv.package = false`) : il ne
# sert qu'à déclarer le workspace uv et à verrouiller l'ensemble des
# dépendances Python en versions exactes + hachages (`uv.lock`), conformément
# à `manifests/dependencies.yaml` (`pin_policy.python: uv_lock_exact`).
#
# ÉCART D'ENVIRONNEMENT — la cible runtime est Python 3.13 ; l'environnement de
# développement fournit 3.11. `requires-python = ">=3.11"` garde le lock
# universel (résolu pour toutes les versions supportées) afin que la CI puisse
# vérifier la cible 3.13 sans casser le plancher local.
[project]
name = "vertex-one"
version = "0.1.0"
description = "Vertex 1.0 Beta — monorepo local-first, lecture seule, analyse uniquement."
requires-python = ">=3.11"
dependencies = [
    "vertex-core",
    "vertex-persistence",
    "vertex-api",
    "vertex-worker",
    "vertex-edge-ibkr",
    "vertex-edge-official",
    "vertex-ingress-tradingview",
]

[project.optional-dependencies]
# Calcul scientifique et oracles différentiels indépendants.
quant = [
    "numpy>=1.26",
    "scipy>=1.12",
    "QuantLib>=1.36",
]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "PyYAML>=6",
    "psycopg>=3.1",
    # Porte `python-quality` (docs/06-quality/CI_GATES.md). Versions EXACTES :
    # un lint dont la version flotte produit un compte de violations non
    # reproductible — le registre de dette a déjà publié deux chiffres
    # incompatibles pour cette raison. `uv.lock` fige ensuite les hachages.
    "ruff==0.15.8",
    "mypy==1.19.1",
    "types-PyYAML==6.0.12.20250915",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/python/vertex_core",
    "packages/python/vertex_persistence",
    "apps/api",
    "apps/worker",
    "apps/edge-ibkr",
    "apps/edge-official",
    "apps/ingress-tradingview",
]

[tool.uv.sources]
vertex-core = { workspace = true }
vertex-persistence = { workspace = true }
vertex-api = { workspace = true }
vertex-worker = { workspace = true }
vertex-edge-ibkr = { workspace = true }
vertex-edge-official = { workspace = true }
vertex-ingress-tradingview = { workspace = true }

# Cible runtime : Python 3.13 (uv.lock au LOT-01 sur la machine cible).
# Plancher local de développement : 3.11 (aucune syntaxe > 3.11 dans le code).
[tool.ruff]
# Le domaine et les adaptateurs sont lus autant qu'écrits : lignes longues
# tolérées jusqu'à 100, jamais au-delà.
line-length = 100
target-version = "py311"  # plancher local ; la cible 3.13 est vérifiée en CI
extend-exclude = ["apps/web", "node_modules", ".venv"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # ordre des imports
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "DTZ",      # datetime SANS timezone — invariant financier
    "T20",      # print() oublié dans du code applicatif
    "RUF",      # règles Ruff
    "S",        # bandit (sécurité)
]
ignore = [
    # Ruff ne sait pas distinguer un texte français d'un identifiant ambigu ;
    # la documentation et les libellés du produit sont en français.
    "RUF001", "RUF002", "RUF003",
    # UP042 (`class X(str, Enum)` -> `StrEnum`) est REFUSÉ ici, et ce n'est pas
    # un contournement de confort : la conversion CHANGE la sémantique.
    # Mesuré sur CPython 3.11.15 :
    #     class A(str, Enum): X = "x"   ->  f"{A.X}" == "A.X"
    #     class B(StrEnum):   X = "x"   ->  f"{B.X}" == "x"
    # Les 30 occurrences sont les énumérations de CONTRAT canoniques
    # (AdviceStatus, GateStatus, Direction, EnvelopeQuality, FreshnessStatus,
    # OutboxStatus, ThesisStatus...) : elles traversent PostgreSQL, le JSON,
    # OpenAPI et les journaux. Toute interpolation existante changerait de
    # sortie silencieusement, et le comportement de `__format__` des Enum à
    # mixin a déjà bougé entre 3.11 et 3.12 : le poste de développement (3.11)
    # ne pourrait donc PAS prouver la cible (3.13).
    # Lever cet ignore est un lot à part entière : inventaire des
    # interpolations, tests de sérialisation DB/JSON/OpenAPI sur 3.13, puis
    # conversion. Suivi dans docs/99-status/DEBT.md.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Les tests utilisent assert (S101) et des constantes SYNTHETIC (S105/S106).
"**/tests/**" = ["S101", "S105", "S106", "S311"]
"**/tests_integration/**" = ["S101", "S105", "S106", "S311"]
"tools/**" = ["T201"]  # les portes CI écrivent leur verdict sur la sortie
"**/conftest.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = [
    "vertex_core", "vertex_persistence", "vertex_api",
    "vertex_worker", "vertex_edge_ibkr", "vertex_edge_official", "vertex_ingress_tv",
]

# ── Porte `python-quality` : typage strict ──────────────────────────────────
# Le monorepo est en src-layout : sans `mypy_path`, mypy ne trouve AUCUN
# paquet du dépôt et rend 90 faux `import-not-found`. Ce n'était pas une
# dette de typage mais une absence de configuration : mypy n'avait jamais
# été configuré ici.
#
# `python_version` n'est PAS épinglé : mypy suit l'interpréteur qui l'exécute
# (3.11 en local, 3.13 en CI), comme `target-version` côté Ruff. La preuve sur
# la cible 3.13 est donc celle de la CI, pas celle du poste.
[tool.mypy]
strict = true
mypy_path = [
    "packages/python/vertex_core/src",
    "packages/python/vertex_persistence/src",
    "apps/api/src",
    "apps/worker/src",
    "apps/edge-ibkr/src",
    "apps/edge-official/src",
    "apps/ingress-tradingview/src",
    "research",
]
# Périmètre de la porte : le code de PRODUCTION et les portes CI.
# Les suites de tests ne sont PAS couvertes — c'est une dette assumée et
# inscrite dans docs/99-status/DEBT.md, pas un oubli.
files = [
    "packages/python/vertex_core/src",
    "packages/python/vertex_persistence/src",
    "apps/api/src",
    "apps/worker/src",
    "apps/edge-ibkr/src",
    "apps/edge-official/src",
    "apps/ingress-tradingview/src",
    "research/pipelines",
    "tools",
]
# Le périmètre s'arrête aux sources : aucune suite de tests n'est vérifiée,
# y compris `tools/tests`. C'est une frontière assumée et uniforme, pas un
# contournement fichier par fichier.
exclude = ["/tests/", "/tests_integration/"]
warn_unused_ignores = true
show_error_codes = true

# Frontière des bibliothèques NON typées (.claude/rules/python.md : isoler
# `Any` à la frontière d'une bibliothèque non typée et valider immédiatement).
# QuantLib ne publie ni stubs ni `py.typed` ; scipy n'expose pas de stubs
# dans la version verrouillée. Ces deux modules sont utilisés uniquement
# derrière les fonctions de calcul de `vertex_core`, dont les signatures
# publiques restent, elles, entièrement typées.
[[tool.mypy.overrides]]
module = ["QuantLib", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# tests_integration/ (PostgreSQL réel) s'exécute explicitement :
#   bash tools/run_checks.sh --integration
testpaths = [
    "packages/python/vertex_core/tests",
    "packages/python/vertex_persistence/tests",
    "apps/api/tests",
    "apps/edge-ibkr/tests",
    "apps/edge-official/tests",
    "apps/ingress-tradingview/tests",
    "apps/worker/tests",
    "tools/tests",
    "research/tests",
]
pythonpath = [
    "apps/ingress-tradingview/src",
    "packages/python/vertex_core/src",
    "packages/python/vertex_persistence/src",
    "apps/api/src",
    "apps/edge-ibkr/src",
    "apps/worker/src",
    "research",
]
addopts = "-q --strict-markers"
markers = [
    "property: tests de propriétés Hypothesis",
    "oracle: tests différentiels contre un oracle indépendant (QuantLib/SciPy)",
    "golden: vecteurs de référence versionnés avec provenance",
]
filterwarnings = ["error::RuntimeWarning"]
